<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mensajería Express | Acceso</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <div class="blur blur-1"></div>
        <div class="blur blur-2"></div>

        <div class="login-wrapper">

            <section class="login-card">

                <div class="brand">

                    <div class="brand-icon">
                        <i class="ri-global-line"></i>
                    </div>

                    <div class="brand-text">
                        <h1>Webcorp <span>Business</span></h1>
                        <p>Sistema de gestión logística</p>
                    </div>

                </div>

                <div class="separator"></div>

                <div class="welcome">
                    <h2>Bienvenido</h2>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>

                <form id="loginForm">

                    <div class="input-group">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <div class="input-box">

                            <i class="ri-mail-line"></i>

                            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com"
                                autocomplete="email" required>

                        </div>

                    </div>

                    <div class="input-group">

                        <div class="password-label">

                            <label for="password">
                                Contraseña
                            </label>

                            <a href="#" id="recuperar">
                                ¿Olvidaste tu contraseña?
                            </a>

                        </div>

                        <div class="input-box">

                            <i class="ri-lock-password-line"></i>

                            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                                autocomplete="current-password" required>

                            <button type="button" id="mostrarPassword" aria-label="Mostrar contraseña">
                                <i class="ri-eye-line"></i>
                            </button>

                        </div>

                    </div>

                    <div id="mensaje" class="mensaje"></div>

                    <button type="submit" id="btnLogin" class="login-button">

                        <span class="button-content">
                            <i class="ri-login-box-line"></i>
                            Iniciar sesión
                        </span>

                    </button>

                </form>

                <div class="system-info">

                    <div class="info-item">
                        <i class="ri-shield-check-line"></i>
                        <span>Acceso seguro</span>
                    </div>

                    <div class="info-item">
                        <i class="ri-cloud-line"></i>
                        <span>Sistema en línea</span>
                    </div>

                </div>

                <div class="footer">
                    <p>Webcorp Business</p>
                    <span>Plataforma de Webcorp Business</span>
                </div>

            </section>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="inicio20.js"></script>

</body>

</html>
